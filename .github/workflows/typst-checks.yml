name: Typst release checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: typst-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  representative-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install fonts required by representative documents
        run: |
          sudo apt-get update
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-firacode ttf-mscorefonts-installer unzip
          font_dir="$HOME/.local/share/fonts/satz-ci"
          mkdir -p "$font_dir"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/stipub/stixfonts/744a22a4dd626cd14d75728aef34fc8ad7c85db0/zipfiles/static_ttf.zip \
            --output "$RUNNER_TEMP/stix-two-static.ttf.zip"
          unzip -j "$RUNNER_TEMP/stix-two-static.ttf.zip" '*.ttf' -d "$font_dir"
          fc-cache --force "$font_dir"
      - name: Verify required fonts are available to Typst
        run: python examples/latex-parity/check_ci_fonts.py
      - name: Install PDF inspection tools
        run: python -m pip install -r .github/requirements-release.txt
      - name: Compile documented starters from the staged package
        run: python examples/latex-parity/check_staged_package.py
      - name: Check compatibility with the published package
        run: python examples/latex-parity/check_published_package.py
      - name: Check representative public APIs and rendered PDFs
        run: |
          python examples/latex-parity/check_appearance_precedence.py
          python examples/latex-parity/check_article.py
          python examples/latex-parity/check_callouts.py
          python examples/latex-parity/check_english_inputs.py
          python examples/latex-parity/check_paragraph_rhythm.py
          python examples/latex-parity/check_placeholders.py
          python examples/latex-parity/check_journal_dates.py
          python examples/latex-parity/check_journal_header.py
          python examples/latex-parity/check_journal_themes.py
          python examples/latex-parity/check_nwo.py
          python examples/latex-parity/check_outlines.py
          python examples/latex-parity/check_proposals.py
          python examples/latex-parity/check_public_input_validation.py
          python examples/latex-parity/check_scientific_tables.py
          python examples/latex-parity/check_tables.py
