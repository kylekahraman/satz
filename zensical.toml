[project]
site_name = "satz"
site_description = "A coherent Typst toolkit for reports, journals, letters, and more."
site_url = "https://kylekahraman.github.io/satz/"
repo_url = "https://github.com/kylekahraman/satz"
repo_name = "kylekahraman/satz"
docs_dir = "docs/site"
site_dir = "site"

nav = [
  { "Start here" = "index.md" },
  { "Get started" = [
    "getting-started/setup.md",
    "getting-started/report.md",
    "getting-started/letter.md",
  ] },
  { "Guides" = [
    "guides/journals.md",
    "guides/figures-and-tables.md",
    "guides/proposals.md",
    "guides/layouts.md",
    "guides/troubleshooting.md",
    "guides/development.md",
  ] },
  { "Reference" = [
    "reference/templates.md",
    "reference/configuration.md",
  ] },
  { "Contributing" = "maintainers/api-design.md" },
  { "GitHub" = "https://github.com/kylekahraman/satz" },
]

[project.theme]
language = "en"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
]

[project.theme.palette]
primary = "indigo"
accent = "blue"

[project.markdown_extensions]
admonition = {}
tables = {}
"pymdownx.details" = {}
"pymdownx.superfences" = {}
