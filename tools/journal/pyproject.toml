[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satz-journal"
version = "0.1.0"
description = "Cross-platform starter and entry launcher for Satz research journals"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
journal = "satz_journal.cli:main"

[tool.setuptools.package-data]
satz_journal = ["templates/*", "runtime/**/*.typ", "runtime/*.typ", "runtime/LICENSE", "runtime/VERSION.txt"]
